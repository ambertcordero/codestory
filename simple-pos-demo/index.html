<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple POS - CodeStory Demo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="pos-header">
    <h1>Simple POS</h1>
    <p>A tiny point-of-sale demo. Everything is local and nothing is charged.</p>
  </header>

  <main class="pos-layout">
    <section class="pos-products" aria-labelledby="productsHeading">
      <h2 id="productsHeading">Products</h2>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <section class="pos-cart" aria-labelledby="cartHeading">
      <div class="cart-header">
        <h2 id="cartHeading">Cart</h2>
        <span class="cart-count"><span id="itemCount">0</span> item(s)</span>
      </div>

      <p class="cart-empty" id="cartEmpty">Your cart is empty. Add a product to begin.</p>
      <ul class="cart-lines" id="cartLines"></ul>

      <div class="cart-totals">
        <p><span>Subtotal</span><span id="subtotalValue">&#8369;0.00</span></p>
        <p><span id="vatLabel">VAT (12%)</span><span id="vatValue">&#8369;0.00</span></p>
        <p class="cart-total"><span>Total</span><span id="totalValue">&#8369;0.00</span></p>
      </div>

      <div class="cart-actions">
        <button class="pos-button primary" type="button" id="checkoutButton" disabled>Checkout</button>
        <button class="pos-button" type="button" id="resetButton" disabled>Reset</button>
      </div>
    </section>
  </main>

  <section class="pos-receipt" id="receipt" aria-live="polite" hidden></section>

  <script type="module" src="js/app.js"></script>
</body>

</html>
